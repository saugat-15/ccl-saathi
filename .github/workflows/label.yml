# Path-based labels: .github/labeler.yml
# Uses pull_request (not pull_request_target) so the config file from the PR
# branch is available on the runner—including the PR that adds labeler.yml.
# For fork PRs that need labels, switch to pull_request_target only after
# .github/labeler.yml is merged into the default branch.
# https://github.com/actions/labeler

name: Labeler
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v6
